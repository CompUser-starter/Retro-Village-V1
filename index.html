<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#63b343" />
    <title>Retro Village</title>
    <style>
      /* Shown before the app's JS/CSS is ready, so the first frame is the
         village splash instead of a flat blue screen. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #63b343;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(to bottom, #7fd0ee 0%, #bfe8f5 46%, #8ed45e 46%, #63b343 100%);
        font-family: ui-monospace, "Courier New", monospace;
        color: #4a2d1c;
        transition: opacity 0.35s ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .logo {
        width: 132px;
        height: 132px;
        border-radius: 28px;
        border: 4px solid #4a2d1c;
        box-shadow: 6px 6px 0 rgba(74, 45, 28, 0.35);
        image-rendering: auto;
        animation: boot-bob 1.6s ease-in-out infinite;
      }
      @keyframes boot-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      #boot .title {
        font-size: 34px;
        letter-spacing: 1px;
        text-shadow: 3px 3px 0 #fff4dc;
      }
      #boot .bar {
        width: 168px;
        height: 16px;
        background: #4a2d1c;
        box-shadow: 0 0 0 4px #4a2d1c;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 36%;
        background: #fbd54a;
        animation: boot-slide 1.1s linear infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <img class="logo" src="icon-512.png" alt="" onerror="this.style.display='none'" />
      <div class="title">Retro Village</div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
